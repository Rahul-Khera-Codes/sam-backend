services:
  sam-backend:
    build:
      context: ./backend
      args:
        GUARDRAILS_TOKEN: ${GUARDRAILS_TOKEN:-}
      secrets:
        - backend_env
    ports:
      - "8003:8000"
    env_file:
      - ./backend/.env
    environment:
      GUARDRAILS_TOKEN: ""
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  sam-agent:
    build: ./agent
    ports:
      - "8001:8001"
    env_file:
      - ./agent/.env.local
    volumes:
      - ./agent:/app
    command: python agent.py dev
    restart: unless-stopped

  sam-executive-agent:
    build: ./agent
    ports:
      - "8002:8001"
    env_file:
      - ./agent/.env.local
    volumes:
      - ./agent:/app
    command: python executive_agent.py dev
    restart: unless-stopped

  sam-hr-onboarding-agent:
    build:
      context: ./agent
      args:
        GUARDRAILS_TOKEN: ${GUARDRAILS_TOKEN:-}
      secrets:
        - backend_env
    ports:
      - "8004:8001"
    env_file:
      - ./agent/.env.local
    volumes:
      - ./agent:/app
    command: python hr_onboarding_agent.py dev
    restart: unless-stopped

  sam-hr-interviewer-agent:
    build: ./agent
    ports:
      - "8005:8001"
    env_file:
      - ./agent/.env.local
    volumes:
      - ./agent:/app
    command: python hr_interviewer_agent.py dev
    restart: unless-stopped

secrets:
  backend_env:
    file: ./backend/.env
