services:
  sam-valkey:
    image: valkey/valkey:latest
    container_name: sam-valkey
    ports:
      - "6379:6379"
    command: valkey-server --save "" --appendonly no
    restart: unless-stopped

  sam-betterdb:
    image: betterdb/monitor:latest
    container_name: sam-betterdb
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DB_HOST: sam-valkey
      DB_PORT: "6379"
      DB_TYPE: valkey
      STORAGE_TYPE: memory
    depends_on:
      - sam-valkey
    restart: unless-stopped

  sam-backend:
    build:
      context: ./backend
      args:
        GUARDRAILS_TOKEN: ${GUARDRAILS_TOKEN:-}
      secrets:
        - backend_env
    ports:
      - "8003:8000"
    env_file:
      - ./backend/.env
    environment:
      GUARDRAILS_TOKEN: ""
      VALKEY_URL: redis://sam-valkey:6379/0
      HR_ONBOARDING_CACHE_TTL_SECONDS: "3600"
      HR_ONBOARDING_CACHE_CLIENT_NAME: hr-onboarding-backend
    volumes:
      - ./backend:/app
    depends_on:
      - sam-valkey
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  sam-agent:
    build: ./agent
    ports:
      - "8001:8001"
    env_file:
      - ./agent/.env.local
    volumes:
      - ./agent:/app
    command: python agent.py dev
    restart: unless-stopped

  sam-executive-agent:
    build: ./agent
    ports:
      - "8002:8001"
    env_file:
      - ./agent/.env.local
    volumes:
      - ./agent:/app
    command: python executive_agent.py dev
    restart: unless-stopped

  sam-hr-onboarding-agent:
    build:
      context: ./agent
      args:
        GUARDRAILS_TOKEN: ${GUARDRAILS_TOKEN:-}
      secrets:
        - backend_env
    ports:
      - "8004:8001"
    env_file:
      - ./agent/.env.local
    environment:
      VALKEY_URL: redis://sam-valkey:6379/0
      HR_ONBOARDING_CACHE_TTL_SECONDS: "3600"
      HR_ONBOARDING_CACHE_CLIENT_NAME: hr-onboarding-voice-agent
    volumes:
      - ./agent:/app
    depends_on:
      - sam-valkey
    command: python hr_onboarding_agent.py dev
    restart: unless-stopped

  sam-hr-interviewer-agent:
    build: ./agent
    ports:
      - "8005:8001"
    env_file:
      - ./agent/.env.local
    volumes:
      - ./agent:/app
    command: python hr_interviewer_agent.py dev
    restart: unless-stopped

secrets:
  backend_env:
    file: ./backend/.env
